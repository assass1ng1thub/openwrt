name: Build WL-WN531AX2

on:
  workflow_dispatch:
  push:
    branches:
      - my-wn531ax2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target for wavlink_wl-wn531ax2
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_wavlink_wl-wn531ax2=y
          EOF
          make defconfig

      - name: Download sources
        run: make download -j8

      - name: Compile firmware
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ramips-mt7621-wl-wn531ax2
          path: bin/targets/ramips/mt7621/*wl-wn531ax2*
